name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: macos-15            # arm64 generation; previous runner label retired Nov 2026
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Runner sanity (arm64 + Tk >= 8.6.8)
        run: |
          [ "$(uname -m)" = "arm64" ] || { echo "FAIL: runner is not arm64"; exit 1; }
          python - <<'TKEOF'
          import re, sys, _tkinter
          patch = None
          try:
              import tkinter
              r = tkinter.Tk(); patch = r.tk.call("info", "patchlevel"); r.destroy()
          except Exception:
              pass
          ref = patch or _tkinter.TK_VERSION
          n = [int(x) for x in re.findall(r"\d+", ref)[:3]]
          print("Tcl/Tk:", _tkinter.TCL_VERSION, "/", _tkinter.TK_VERSION, "patchlevel:", patch)
          if len(n) >= 3:
              sys.exit(0 if n[:3] >= [8, 6, 8] else "Tk %s below minimum 8.6.8" % ref)
          sys.exit(0 if n >= [8, 6] else "Tk %s below minimum 8.6.8 (patch unknown)" % ref)
          TKEOF
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: CLI degrades gracefully when Splash is down
        run: |
          set +e
          out=$(python splash_monitor.py --url http://127.0.0.1:59999 --cli 2>&1)
          rc=$?
          echo "$out"
          [ $rc -ne 0 ] || { echo "expected non-zero exit"; exit 1; }
          echo "$out" | grep -q "连不上" || { echo "expected clear unavailable message"; exit 1; }

  build:
    runs-on: macos-15            # arm64; bundles target Apple Silicon
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build app bundle
        env:
          PY: python3.12
        run: ./build_app.sh
      - name: Bundle sanity
        run: |
          APP="dist/Splash Monitor.app"
          test -x "$APP/Contents/MacOS/Splash Monitor"
          plutil -p "$APP/Contents/Info.plist" | grep -q "Splash Monitor"
          if ! find "$APP/Contents/Frameworks" -iname "*tcl*" -maxdepth 2 | grep -q .; then
            echo "FAIL: Tcl/Tk not bundled"; exit 1
          fi
          # Frozen binary must degrade gracefully without an engine.
          if "$APP/Contents/MacOS/Splash Monitor" --url http://127.0.0.1:59999 --cli; then
            echo "FAIL: expected non-zero exit with no engine"; exit 1
          fi
      - name: Package app with ditto
        # upload-artifact's directory walk can drop Unix exec bits and
        # symlink semantics; a macOS-native ditto ZIP preserves the exact
        # bundle (permissions, symlinks, code signature) for distribution.
        run: ditto -c -k --keepParent "dist/Splash Monitor.app" "Splash-Monitor-v1.0.0-macos-arm64.zip"
      - name: ZIP round-trip verification
        run: |
          rm -rf /tmp/zipcheck && mkdir -p /tmp/zipcheck
          ditto -x -k "Splash-Monitor-v1.0.0-macos-arm64.zip" /tmp/zipcheck
          APP="/tmp/zipcheck/Splash Monitor.app"
          test -x "$APP/Contents/MacOS/Splash Monitor" || { echo "FAIL: exec bit lost"; exit 1; }
          src_links=$(find "dist/Splash Monitor.app" -type l | wc -l | tr -d ' ')
          dst_links=$(find "$APP" -type l | wc -l | tr -d ' ')
          [ "$src_links" = "$dst_links" ] || { echo "FAIL: symlinks lost ($src_links -> $dst_links)"; exit 1; }
          codesign --verify --deep --strict "$APP" || { echo "FAIL: signature broken after unzip"; exit 1; }
      - uses: actions/upload-artifact@v4
        with:
          name: Splash-Monitor-v1.0.0-macos-arm64-zip
          path: Splash-Monitor-v1.0.0-macos-arm64.zip
